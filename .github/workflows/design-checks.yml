name: Design checks

on:
  push:
    branches: [main, skill-design]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check design and reference fixtures
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee verification-run.txt
      - name: Package tracked design files
        run: git archive --format=zip --output=AI-Interview-0.1.0.zip HEAD
      - name: Save checks and package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-interview-design
          path: |
            verification-run.txt
            AI-Interview-0.1.0.zip
          retention-days: 7
