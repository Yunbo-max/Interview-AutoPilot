interface:
  display_name: "AI Interview"
  short_description: "Career profile, role-specific interviews and research freshness"
  default_prompt: "Use $ai-interview to run /profile, /scrape, /rank, /interview, /memory, or /trends as requested. Never auto-apply. For an interview, run a challenging mock interview using my existing materials. Match my language, verify host capabilities, and ask one question at a time. For microphone answers, prefer the bundled voice-first studio with PDF resume upload, role selection and model consent; otherwise use the local voice commands and wait for confirmed text."
policy:
  allow_implicit_invocation: false
